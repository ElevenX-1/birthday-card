<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="一场像素烟花，和所有想对你说的话。写下祝福，让它飘进今晚的夜空。"
    />
    <meta name="theme-color" content="#050817" />
    <meta property="og:title" content="生日贺卡 · 谢Bro" />
    <meta
      property="og:description"
      content="一场像素烟花，和所有想对你说的话。写下祝福，让它飘进今晚的夜空。"
    />
    <meta property="og:type" content="website" />
    <title>生日贺卡 · 谢Bro</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="stars" id="stars"></div>
      <div class="moon" id="moon"></div>
      <div class="horizon"></div>
    </div>

    <canvas id="fireworks" class="fireworks" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="danmaku-layer" id="danmakuLayer" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="./" aria-label="回到生日烟花首页">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-text">BIRTHDAY.EXE</span>
        <span class="brand-cursor" aria-hidden="true">_</span>
      </a>

      <div class="top-actions">
        <button
          class="icon-btn"
          id="musicBtn"
          type="button"
          aria-label="播放背景音乐"
          aria-pressed="false"
          title="播放背景音乐"
        >
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M10 1.8v8.05a2.2 2.2 0 1 1-1.6-2.12V4.1l4.3-1.05v6.8a2.2 2.2 0 1 1-1.6-2.12V1.8z"
              fill="currentColor"
            />
          </svg>
          <span class="music-live" aria-hidden="true"></span>
        </button>

        <button
          class="icon-btn"
          id="soundBtn"
          type="button"
          aria-label="开启声音"
          aria-pressed="false"
          title="开启声音"
        >
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 6h3l4-3v10L5 10H2z" fill="currentColor" />
            <g class="sound-waves" fill="none" stroke="currentColor" stroke-width="1.4">
              <path d="M11 5.4c1.1 1.2 1.1 4 0 5.2" />
              <path d="M13.2 3.4c2 2.3 2 7 0 9.2" />
            </g>
            <path class="sound-slash" d="M2 2l12 12" fill="none" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </button>

        <button
          class="icon-btn"
          id="wallBtn"
          type="button"
          aria-label="打开祝福墙"
          title="祝福墙"
        >
          <svg class="ico ico-heart" viewBox="0 0 8 7" shape-rendering="crispEdges" aria-hidden="true">
            <g fill="currentColor">
              <rect x="1" y="0" width="2" height="1" />
              <rect x="5" y="0" width="2" height="1" />
              <rect x="0" y="1" width="8" height="3" />
              <rect x="1" y="4" width="6" height="1" />
              <rect x="2" y="5" width="4" height="1" />
              <rect x="3" y="6" width="2" height="1" />
            </g>
          </svg>
          <span class="badge" id="badgeCount">0</span>
        </button>

        <button
          class="icon-btn"
          id="boomBtn"
          type="button"
          aria-label="放一场烟花"
          title="放一场烟花"
        >
          <svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M7 0h2v6h6v2h-6v6H7V8H1V6h6z"
              fill="currentColor"
            />
          </svg>
        </button>
      </div>
    </header>

    <main class="hero">
      <div class="hero-inner">
        <p class="eyebrow">
          <span class="eyebrow-spark" aria-hidden="true">✦</span>
          <span id="eyebrowText">A LITTLE SURPRISE FOR</span>
          <span class="eyebrow-spark" aria-hidden="true">✦</span>
        </p>

        <div class="name-row">
          <span class="name-spark left" aria-hidden="true">✦</span>
          <h1 class="name" id="birthdayName">谢Bro</h1>
          <span class="name-spark right" aria-hidden="true">✦</span>
        </div>

        <h2 class="sr-only">HAPPY BIRTHDAY</h2>
        <canvas
          id="pixelTitle"
          class="pixel-title"
          width="340"
          height="44"
          role="img"
          aria-label="HAPPY BIRTHDAY"
        ></canvas>

        <div class="cake-row" aria-hidden="true">
          <svg class="cake" viewBox="0 0 32 32" shape-rendering="crispEdges">
            <g class="flame">
              <rect x="15" y="1" width="2" height="2" fill="#ffe6a1" />
              <rect x="14" y="3" width="4" height="2" fill="#ffb347" />
              <rect x="15" y="5" width="2" height="2" fill="#ff6b6b" />
            </g>
            <rect x="15" y="7" width="2" height="6" fill="#f7f1d0" />
            <rect x="13" y="12" width="6" height="2" fill="#c4a7ff" />
            <rect x="6" y="14" width="20" height="4" fill="#ff8fb8" />
            <rect x="6" y="18" width="3" height="2" fill="#ff8fb8" />
            <rect x="12" y="18" width="3" height="2" fill="#ff8fb8" />
            <rect x="20" y="18" width="3" height="2" fill="#ff8fb8" />
            <rect x="6" y="20" width="20" height="8" fill="#f6d6a8" />
            <rect x="6" y="22" width="20" height="1" fill="#e7b97f" />
            <rect x="6" y="25" width="20" height="1" fill="#e7b97f" />
            <rect x="10" y="20" width="2" height="2" fill="#7de9ff" />
            <rect x="17" y="23" width="2" height="2" fill="#ffd166" />
            <rect x="23" y="20" width="2" height="2" fill="#ff6fae" />
            <rect x="3" y="28" width="26" height="2" fill="#8ea0d9" />
          </svg>
        </div>

        <p class="subtitle" id="subtitleText">
          生日快乐，愿你的每一天都像烟花一样闪闪发光
        </p>

        <div class="hero-actions">
          <button class="pixel-btn primary" id="writeBtn" type="button">写下祝福</button>
          <button class="pixel-btn ghost" id="heroBoomBtn" type="button">
            <span class="btn-spark" aria-hidden="true">✦</span>
            点亮夜空
          </button>
        </div>

        <div class="quick-wish-row">
          <button class="quick-wish" id="quickWishBtn" type="button">
            <span class="quick-wish-heart" aria-hidden="true">♥</span>
            <span>生日快乐！</span>
          </button>
          <span class="quick-wish-count" id="quickWishCount" aria-live="polite">0 次</span>
        </div>

        <button class="music-hint" id="musicHint" type="button">
          <span class="music-bars" aria-hidden="true"><i></i><i></i><i></i></span>
          开启生日钢琴曲
        </button>
      </div>
    </main>

    <section class="composer" aria-labelledby="composerTitle">
      <div class="composer-top">
        <div class="composer-heading">
          <h2 id="composerTitle">写下你的祝福</h2>
          <p class="composer-sub">留言会变成弹幕，飘进 TA 的夜空</p>
        </div>
        <span class="live-pill" id="livePill">
          <i aria-hidden="true"></i>
          <span id="statusLine">连接星空…</span>
        </span>
      </div>

      <form id="wishForm" class="wish-form" autocomplete="off">
        <label class="field name-field">
          <span class="sr-only">你的名字</span>
          <input
            id="guestName"
            name="name"
            type="text"
            maxlength="16"
            placeholder="你的名字（选填）"
            autocomplete="nickname"
          />
        </label>

        <label class="field text-field">
          <span class="sr-only">祝福内容</span>
          <input
            id="wishText"
            name="text"
            type="text"
            maxlength="80"
            placeholder="想对 TA 说点什么…"
            autocomplete="off"
            required
          />
        </label>

        <button class="pixel-btn send" id="sendBtn" type="submit">
          <span class="send-label">送出祝福</span>
          <span class="send-arrow" aria-hidden="true">→</span>
        </button>
      </form>

      <p class="composer-foot">
        <span id="wishTotal">0 条祝福</span>
        <span class="foot-sep" aria-hidden="true">·</span>
        <span>每条留言都会在星空里滚动</span>
      </p>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog class="wall-dialog" id="wallDialog" aria-labelledby="wallTitle">
      <div class="wall-card">
        <div class="wall-head">
          <h2 id="wallTitle">祝福墙 <span id="wallCount">0</span></h2>
          <button class="icon-btn wall-close" id="closeWall" type="button" aria-label="关闭祝福墙">
            <span aria-hidden="true">✕</span>
          </button>
        </div>
        <p class="wall-sub">每一句祝福，都变成了夜空里的一颗小星星。</p>
        <ul class="wall-list" id="wallList"></ul>
        <p class="wall-empty" id="wallEmpty" hidden>还没有留言，来当第一个吧。</p>
      </div>
    </dialog>

    <noscript>
      <p class="noscript">请开启 JavaScript，才能看到今晚的烟花和留言。</p>
    </noscript>

    <audio id="bgMusic" src="assets/happy-birthday-piano.mp3" loop preload="auto"></audio>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
